<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JND Integrated Solutions</title>

  <!-- Inter — brand typeface (DESIGN.md: 400/500/600/700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Bootstrap 5.3.8 — base styles (must load before assets/css/jnd.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <!-- JND brand layer — tokens, type scale, gradients, button/card overrides -->
  <link rel="stylesheet" href="assets/css/jnd.css">

  <!-- Bootstrap 5.3.8 bundle (Popper + Bootstrap) for dropdowns, collapse, etc. -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- ===================================================================
       TEMPORARY VERIFICATION BLOCK (TASK-003 / TASK-004)
       Confirms Bootstrap CSS, Bootstrap JS, Inter and assets/css/jnd.css
       are all loading. Delete this entire <main> at TASK-011.
       =================================================================== -->
  <main class="container py-5">
    <h1>Bootstrap + Inter + brand layer</h1>

    <p class="lead">
      Headings should now be JND navy, the button JND blue with an accent
      gradient, and this paragraph in Inter at 16px / 1.6.
    </p>

    <div class="row g-4 my-2">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card"><div class="card-body">Grid column 1</div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card"><div class="card-body">Grid column 2</div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card"><div class="card-body">Grid column 3</div></div>
      </div>
    </div>

    <!-- Exercises the Bootstrap JS bundle: this dropdown only opens if it loaded. -->
    <div class="d-flex flex-wrap gap-3 align-items-center">
      <a class="btn btn-primary" href="#">Primary</a>
      <a class="btn btn-outline-primary" href="#">Secondary</a>
      <div class="bg-grad-primary p-3 rounded">
        <a class="btn btn-outline-light" href="#">Ghost on dark</a>
      </div>
    </div>

    <div class="dropdown mt-3">
      <button class="btn btn-primary dropdown-toggle" type="button"
              data-bs-toggle="dropdown" aria-expanded="false">
        JS bundle check
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Opens means Bootstrap JS works</a></li>
        <li><a class="dropdown-item" href="#">Second item</a></li>
      </ul>
    </div>
  </main>

</body>
</html>
