<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="JND Integrated Solutions — Reliable Support. Professional Service.">
  <!--
    The Open Graph / Twitter share card (1200x630, the size both Facebook and
    X read without cropping). This SVG is the source; assets/img/og-image.png
    is what the pages actually reference, because most link-preview scrapers
    still will not accept an SVG. Regenerate the PNG after editing here:

      rsvg-convert -w 1200 -h 630 assets/img/og-image.svg -o assets/img/og-image.png

    Colours are the brand tokens from assets/css/jnd.css. The wordmark is set
    in a system sans rather than Inter, because the rasteriser that builds the
    PNG has no access to the webfont.
  -->

  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123B73"/>
      <stop offset="65%" stop-color="#1455A0"/>
      <stop offset="100%" stop-color="#2878B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#band)"/>

  <!-- Network motif: a small hub-and-spoke of brand-coloured nodes, kept to the
       right so it never sits behind the text. Decorative, so it says nothing to
       a screen reader and everything to an eye. -->
  <g fill="none" stroke="#62D5E8" stroke-width="3" opacity="0.45">
    <line x1="980" y1="250" x2="1090" y2="180"/>
    <line x1="980" y1="250" x2="1110" y2="290"/>
    <line x1="980" y1="250" x2="1060" y2="380"/>
    <line x1="980" y1="250" x2="900" y2="400"/>
  </g>
  <g fill="#50B8E8">
    <circle cx="980" cy="250" r="16"/>
    <circle cx="1090" cy="180" r="11"/>
    <circle cx="1110" cy="290" r="11"/>
    <circle cx="1060" cy="380" r="11"/>
    <circle cx="900" cy="400" r="11"/>
  </g>

  <g font-family="'DejaVu Sans','Noto Sans',sans-serif">
    <text x="96" y="250" fill="#FFFFFF" font-size="128" font-weight="700" letter-spacing="2">JND</text>
    <text x="96" y="312" fill="#62D5E8" font-size="46" font-weight="700" letter-spacing="1">Integrated Solutions</text>
    <text x="96" y="392" fill="#FFFFFF" font-size="34">IT that keeps your business running</text>
    <rect x="96" y="432" width="120" height="6" fill="#62D5E8"/>
    <text x="96" y="500" fill="#DCE6F2" font-size="26">Reliable Support. Professional Service.</text>
    <text x="96" y="548" fill="#A9C2DD" font-size="22">IT Support · Networking · Cloud · Cybersecurity · CCTV</text>
  </g>
</svg>
